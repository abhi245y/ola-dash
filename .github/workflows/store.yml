name: Store

on:
  pull_request:
    paths:
      - 'store/**'
      - 'tools/store/**'
      - '.github/workflows/store.yml'

permissions:
  contents: read

jobs:
  store:
    name: Index and submissions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0   # origin/main is needed for the seq and changed-entry comparison

      - name: System libraries for sim (fontconfig, xkbcommon)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sdk/sim/target
          key: cargo-sim-${{ runner.os }}-${{ hashFiles('sdk/sim/Cargo.lock') }}

      - name: Unit tests
        run: python3 -m unittest discover -s tools/store -t tools/store

      - name: Check index
        run: python3 tools/store/check_index.py

      - name: Find changed entries
        id: changed
        run: |
          python3 tools/store/check_index.py --changed > changed.json
          echo "themes=$(jq 'any(.[]; .kind=="theme")' changed.json)" >> "$GITHUB_OUTPUT"
          echo "plugins=$(jq 'any(.[]; .kind=="plugin")' changed.json)" >> "$GITHUB_OUTPUT"

      - name: Android build-tools (plugin checks only)
        if: steps.changed.outputs.plugins == 'true'
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: 'build-tools;34.0.0'

      - name: Check changed entries
        if: steps.changed.outputs.themes == 'true' || steps.changed.outputs.plugins == 'true'
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          mkdir -p dl out
          while read -r e; do
            kind=$(jq -r .kind <<<"$e"); url=$(jq -r .url <<<"$e")
            size=$(jq -r .size <<<"$e"); sha=$(jq -r .sha256 <<<"$e")
            f="dl/$(jq -r '.id // .package' <<<"$e").$([ "$kind" = theme ] && echo zip || echo apk)"
            echo "== $kind $url"
            curl -fsSL --proto '=https' --proto-redir '=https' --max-filesize 52428800 -o "$f" "$url"
            [ "$(stat -c %s "$f")" = "$size" ] || { echo "error: $f is $(stat -c %s "$f") bytes, index says $size" >&2; exit 1; }
            [ "$(sha256sum "$f" | cut -d' ' -f1)" = "$sha" ] || { echo "error: sha256 of $f differs from the index" >&2; exit 1; }
            if [ "$kind" = theme ]; then
              python3 tools/store/check_theme_zip.py "$f" --id "$(jq -r .id <<<"$e")" --out "out/$(jq -r .id <<<"$e")"
            else
              python3 tools/store/check_plugin_apk.py "$f" | tee "out/$(jq -r .package <<<"$e").json" > /dev/null
              # the checker's facts must equal the index entry
              jq -e --slurpfile got "out/$(jq -r .package <<<"$e").json" \
                '. as $i | $got[0] | to_entries | all(.[]; $i[.key] == .value)' <<<"$e" > /dev/null \
                || { echo "error: index entry differs from what the APK declares" >&2; exit 1; }
            fi
          done < <(jq -c '.[]' changed.json)

      - name: Upload preview captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: store-previews
          path: out/
          if-no-files-found: ignore
